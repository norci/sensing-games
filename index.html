<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>体感水果忍者</title>
  <!-- 修复部分安卓浏览器 navigator.mediaDevices 为 undefined 的问题 -->
  <script>
    (function () {
      if (!navigator.mediaDevices) navigator.mediaDevices = {};
      if (navigator.mediaDevices.getUserMedia) return;
      var legacy = navigator.getUserMedia ||
                  navigator.webkitGetUserMedia ||
                  navigator.mozGetUserMedia ||
                  navigator.msGetUserMedia;
      navigator.mediaDevices.getUserMedia = legacy
        ? function (constraints) {
            return new Promise(function (resolve, reject) {
              legacy.call(navigator, constraints, resolve, reject);
            });
          }
        : function () {
            return Promise.reject(new Error('浏览器不支持摄像头'));
          };
    })();
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      z-index: 1;
      transform: scaleX(-1); /* 镜像翻转 */
      border: none;
      border-radius: 0;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: auto;
      background: rgba(26, 26, 46, 0.6);
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 100;
    }

    #loading h2 {
      margin-bottom: 20px;
    }

    .spinner {
      border: 4px solid #333;
      border-top: 4px solid #fff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #ff0000;
      z-index: 100;
      display: none;
    }

    #cameraPrompt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(0, 0, 0, 0.8);
      padding: 30px;
      border-radius: 15px;
      z-index: 100;
    }

    #cameraPrompt button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }

   </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline muted webkit-playsinline></video>
    <canvas id="gameCanvas"></canvas>

    <div id="loading">
      <h2>体感水果忍者</h2>
      <div class="spinner"></div>
      <p>正在加载...</p>
    </div>

    <div id="error">
      <h2>错误</h2>
      <p id="errorMessage"></p>
    </div>

    <div id="cameraPrompt" style="display: none;">
      <h2>需要摄像头权限</h2>
      <p>请允许浏览器访问摄像头以进行体感游戏</p>
      <button id="enableCamera">启用摄像头</button>
    </div>

  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
